<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Regna - Sternenkarte (Live)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        :root { --hex-size: 26px; }
        body { margin:0; padding:0; background:#000; color:#a0d8ff; font-family:'Orbitron',sans-serif; height:100vh; display:flex; overflow:hidden; }
        #sidebar { width:190px; background:rgba(0,20,40,0.98); border-right:2px solid #00aaff; padding:10px; overflow-y:auto; }
        .hex-grid { display:grid; grid-template-columns:repeat(155, calc(var(--hex-size)*1.732)); gap:2px; width:max-content; }
        .hex { position:relative; width:var(--hex-size); height:calc(var(--hex-size)*1.1547); background:rgba(20,30,55,0.9);
               clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); border:1px solid rgba(0,170,255,0.5);
               cursor:pointer; transition:all 0.2s; }
        .hex:hover { transform:scale(1.25); z-index:20; box-shadow:0 0 20px #00ddff; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>📜 Legende</h3>
        <div id="legend"></div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column;">
        <header style="background:rgba(0,20,40,0.98); padding:10px; border-bottom:2px solid #00aaff; display:flex; justify-content:space-between;">
            <h2>Per Regna — Sternenkarte (155×80) <span style="color:#00ff00;">● LIVE</span></h2>
        </header>
        <div style="flex:1; overflow:auto; padding:20px; background:#05050f;" id="mapWrapper">
            <div class="hex-grid" id="hexGrid"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC14sG85fPu0DazZwcnmXmSmwjz3q9SBdU",
          authDomain: "starmap-de973.firebaseapp.com",
          databaseURL: "https://starmap-de973-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "starmap-de973",
          storageBucket: "starmap-de973.firebasestorage.app",
          messagingSenderId: "1030470652779",
          appId: "1:1030470652779:web:46b2e14050ea45b39cf22e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const mapRef = db.ref('starmap');

        let hexData = {};

        const colorDefinitions = [
            {id:0, name:"Eigen", color:"#00c850"},
            {id:1, name:"Feind", color:"#dc2828"},
            {id:2, name:"Blau", color:"#2878dc"},
            {id:3, name:"Lila", color:"#b43cdc"},
            {id:4, name:"Orange", color:"#f08c14"},
            {id:5, name:"Türkis", color:"#00c8c8"}
        ];

        function generateLegend() {
            const container = document.getElementById('legend');
            container.innerHTML = colorDefinitions.map(c => 
                `<div style="margin:4px 0; display:flex; align-items:center; gap:8px;">
                    <div style="width:20px;height:20px;background:${c.color};border:1px solid white;"></div>
                    <span>${c.id} - ${c.name}</span>
                </div>`
            ).join('');
        }

        function generateHexGrid() {
            const grid = document.getElementById('hexGrid');
            grid.innerHTML = '';
            for (let row = 0; row < 80; row++) {
                for (let col = 0; col < 155; col++) {
                    const hex = document.createElement('div');
                    hex.className = 'hex';
                    const id = `h${row}-${col}`;
                    hex.dataset.id = id;
                    hex.innerHTML = `<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:7.5px;color:#88ccff;">${col+1}</span>`;
                    hex.onclick = () => editHex(id, hex);
                    grid.appendChild(hex);
                }
            }
        }

        function editHex(id, hexElement) {
            const data = hexData[id] || {};
            let colorId = prompt(`Farbe für ${id.replace('h','')} (0-5):\n0=Eigen\n1=Feind\n2=Blau\n3=Lila\n4=Orange\n5=Türkis\n\nAktuell: ${data.color || 0}`, data.color || 0);
            
            if (colorId === null) return;
            colorId = parseInt(colorId);
            
            hexData[id] = { color: colorId };
            mapRef.child(id).set({ color: colorId });
            applyColor(hexElement, colorId);
        }

        function applyColor(hex, colorId) {
            const def = colorDefinitions[colorId];
            if (def) hex.style.background = def.color + "dd";
        }

        // Initial Load + Live Updates
        mapRef.on('value', (snapshot) => {
            hexData = snapshot.val() || {};
            document.querySelectorAll('.hex').forEach(hex => {
                const id = hex.dataset.id;
                if (hexData[id]) applyColor(hex, hexData[id].color);
            });
        });

        window.onload = () => {
            generateLegend();
            generateHexGrid();
        };
    </script>
</body>
</html>
