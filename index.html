<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Regna - Sternenkarte (Live)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        :root { --hex-size: 26px; }
        body { margin:0; padding:0; background:#000; color:#a0d8ff; font-family:'Orbitron',sans-serif; height:100vh; display:flex; overflow:hidden; }
        #sidebar { width:180px; background:rgba(0,20,40,0.98); border-right:2px solid #00aaff; padding:10px; overflow-y:auto; }
        .hex-grid { display:grid; grid-template-columns:repeat(155, calc(var(--hex-size)*1.732)); gap:2px; width:max-content; }
        .hex { position:relative; width:var(--hex-size); height:calc(var(--hex-size)*1.1547); background:rgba(20,30,55,0.9);
               clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); border:1px solid rgba(0,170,255,0.5);
               cursor:pointer; transition:all 0.2s; }
        .hex:hover { transform:scale(1.25); z-index:20; box-shadow:0 0 20px #00ddff; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>📜 Legende</h3>
        <div id="legendContainer"></div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column;">
        <header style="background:rgba(0,20,40,0.98); padding:10px; border-bottom:2px solid #00aaff;">
            <h2>Per Regna — Sternenkarte (155×80) <span style="color:#00ff00;">● LIVE</span></h2>
        </header>
        <div style="flex:1; overflow:auto; padding:20px; background:#05050f;" id="mapWrapper">
            <div class="hex-grid" id="hexGrid"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC14sG85fPu0DazZwcnmXmSmwjz3q9SBdU",
          authDomain: "starmap-de973.firebaseapp.com",
          databaseURL: "https://starmap-de973-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "starmap-de973",
          storageBucket: "starmap-de973.firebasestorage.app",
          messagingSenderId: "1030470652779",
          appId: "1:1030470652779:web:46b2e14050ea45b39cf22e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const mapRef = db.ref('starmap');

        let hexData = {};

        const colors = [
            {id:0, name:"Eigen", color:"#00c850"},
            {id:1, name:"Feind", color:"#dc2828"},
            {id:2, name:"Blau", color:"#2878dc"},
            {id:3, name:"Lila", color:"#b43cdc"},
            {id:4, name:"Orange", color:"#f08c14"}
        ];

        function generateHexGrid() {
            const grid = document.getElementById('hexGrid');
            grid.innerHTML = '';
            for (let row = 0; row < 80; row++) {
                for (let col = 0; col < 155; col++) {
                    const hex = document.createElement('div');
                    hex.className = 'hex';
                    const id = `h${row}-${col}`;
                    hex.dataset.id = id;
                    hex.innerHTML = `<span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;color:#88ccff;">${col+1}</span>`;
                    hex.onclick = () => editHex(id, hex);
                    grid.appendChild(hex);
                }
            }
        }

        function applyAllColors() {
            document.querySelectorAll('.hex').forEach(hex => {
                const id = hex.dataset.id;
                if (hexData[id] && hexData[id].color !== undefined) {
                    hex.style.background = colors[hexData[id].color].color + "dd";
                }
            });
        }

        function editHex(id, hexElement) {
            const current = hexData[id] ? hexData[id].color : 0;
            const input = prompt(`Farbe 0-4 für ${id.replace('h','')}:\n0=Eigen 1=Feind 2=Blau 3=Lila 4=Orange`, current);
            if (input === null) return;
            
            const newColor = parseInt(input);
            if (isNaN(newColor) || newColor < 0 || newColor > 4) return alert("Nur 0 bis 4!");

            hexData[id] = { color: newColor };
            mapRef.child(id).set({ color: newColor });
            hexElement.style.background = colors[newColor].color + "dd";
        }

        // Daten beim Laden holen
        mapRef.once('value', (snapshot) => {
            hexData = snapshot.val() || {};
            applyAllColors();
            console.log("Daten geladen:", Object.keys(hexData).length, "Hexes");
        });

        // Live-Änderungen von anderen
        mapRef.on('child_changed', (snapshot) => {
            const id = snapshot.key;
            const data = snapshot.val();
            hexData[id] = data;
            const hex = document.querySelector(`[data-id="${id}"]`);
            if (hex) hex.style.background = colors[data.color].color + "dd";
        });

        window.onload = generateHexGrid;
    </script>
</body>
</html>
